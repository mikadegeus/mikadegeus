<text x="60" y="172" class="sans" font-size="88" font-weight="800" fill="#F3F4F7" text-anchor="start" letter-spacing="-2">Mika de Geus</text>
<text x="64" y="220" class="sans" font-size="24" font-weight="400" fill="#98A0B3" text-anchor="start" letter-spacing="0">I build and run systems end to end: server software, web apps,</text>
<text x="64" y="252" class="sans" font-size="24" font-weight="400" fill="#98A0B3" text-anchor="start" letter-spacing="0">the infrastructure underneath and the automation in between.</text>
