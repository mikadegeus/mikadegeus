  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>
<rect width="1200" height="360" rx="20" fill="none" stroke="#2A2F3D" stroke-width="2"/>
  <circle cx="1080" cy="40" r="260" fill="url(#glowRed)"/>
  <circle cx="80" cy="380" r="260" fill="url(#glowBlue)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E3350D"/>
