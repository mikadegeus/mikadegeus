<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Toolbox</title>
<desc id="desc">LANGUAGES: Java, TypeScript, JavaScript, Python, SQL, Bash. GAME SERVERS: Fabric, Velocity, Paper, Gradle, JUnit 5, LuckPerms. WEB: Astro, React, Next.js, Express, Vite, Tailwind CSS, Prisma, Firebase. DATA &amp; INFRA: Redis, MariaDB, MongoDB, Docker, Linux, Caddy, Nginx, Cloudflare. AUTOMATION: n8n, Puppeteer, Python scripting. SECURITY: Burp Suite, nmap, Wireshark, Scapy, Authelia, OWASP, ISO 27001, MITRE ATT&amp;CK.</desc>
<defs>
<style>
  .mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .flow{stroke-dasharray:6 18;animation:flow 1.4s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  .tw{animation:tw 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes pulse{50%{opacity:.25}}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.tw,.blink{animation:none}}
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".06"/></pattern>

