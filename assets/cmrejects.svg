<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Featured project: Cobblemon Rejects</title>
<desc id="desc">Featured project: Cobblemon Rejects, a Minecraft network where my role is lead developer, covering architecture, mods and operations. Players connect through a single Velocity proxy that routes them to five pure Fabric 1.21.1 backends: hub, peaceful, hard, resource and adventure. Shared state lives in Redis, MariaDB and MongoDB. What I built: the architecture (proxy and five Fabric backends), 15 custom mods in Java 21, the sync layer over Redis, MariaDB and MongoDB, and the operations with Docker, backups and 2FA. The hard part: a version-guarded Redis handoff, so switching worlds never rolls a player back.</desc>
