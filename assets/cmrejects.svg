<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Cobblemon Rejects: network overview</title>
<desc id="desc">Cobblemon Rejects, a commercial Minecraft network that is live in production, where Mika is lead developer. Players connect through a single Velocity proxy that routes them to five pure Fabric 1.21.1 backends: hub, peaceful, hard, resource and adventure. Shared state lives in Redis (handoff and chat), MariaDB (player state) and MongoDB (Cobblemon data). Base stats: 5 Fabric backends, 1 Velocity proxy, 15 custom mods, 3 datastores, about 120 mods in the client pack. Party, PC, Pokédex, inventory, economy and location follow every player across all five worlds. Stack: Java 21, Fabric, Velocity, Redis, MariaDB, MongoDB, Docker.</desc>
