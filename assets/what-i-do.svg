<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">What I do</title>
<desc id="desc">Game servers and infrastructure: Lead Developer at Cobblemon Rejects, a Minecraft network. A Velocity proxy and 5 Fabric backends, 15 custom server-side mods in Java 21, cross-server sync over Redis, MariaDB and MongoDB, Docker operations with encrypted backups and 2FA, and a Discord bot for the community. Automation Specialist in financial services (lending): bank statement checks, email handling and business credit proposals. Security, AD Cybersecurity at HvA: pentesting, OSINT, risk analysis, network and OT/ICS security. Web: the Studio Lumeza website, built with Astro as client work.</desc>
<defs>
<style>
  .mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .flow{stroke-dasharray:6 18;animation:flow 1.4s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  .tw{animation:tw 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes pulse{50%{opacity:.25}}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.tw,.blink{animation:none}}
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".06"/></pattern>

