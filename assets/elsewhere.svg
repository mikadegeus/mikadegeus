<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Work beyond Cobblemon Rejects</title>
<desc id="desc">Automation Specialist in financial services (lending), automating the back office: bank statement checks, email handling and business credit proposals. AD Cybersecurity at HvA: pentesting, OSINT, risk analysis, network analysis and OT/ICS security. Web: the Studio Lumeza website, built with Astro as client work.</desc>
<defs>
<style>
  .mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .flow{stroke-dasharray:6 18;animation:flow 1.4s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  .tw{animation:tw 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes pulse{50%{opacity:.25}}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.tw,.blink{animation:none}}
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".06"/></pattern>

</defs>

