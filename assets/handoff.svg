<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">The cross-server handoff</title>
<desc id="desc">How Cobblemon Rejects moves a player between worlds without rollbacks or lost items. Step 1, save: the source world saves the player, then marks them ready in Redis. Step 2, wait: the target world waits for that ready signal before it loads anything. Step 3, guard: every write carries a version, so a stale save never overwrites newer data. Result: no rollbacks, no lost items, and one chat relayed across all five worlds.</desc>
<defs>
<style>
  .mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .flow{stroke-dasharray:6 18;animation:flow 1.4s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  .tw{animation:tw 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes pulse{50%{opacity:.25}}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.tw,.blink{animation:none}}
</style>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".06"/></pattern>

</defs>

<rect width="1200" height="420" rx="20" fill="#0E1016"/>
<rect width="1200" height="420" rx="20" fill="url(#dots)"/>
<rect width="1200" height="420" rx="20" fill="none" stroke="#2A2F3D" stroke-width="2"/>
<text x="56" y="62" class="mono" font-size="16" font-weight="700" fill="#FFCB05" text-anchor="start" letter-spacing="3">CMREJECTS · THE HARD PART</text>
<text x="54" y="110" class="sans" font-size="42" font-weight="800" fill="#F3F4F7" text-anchor="start" letter-spacing="0">The cross-server handoff</text>
<text x="1144" y="110" class="sans" font-size="18" font-weight="400" fill="#98A0B3" text-anchor="end" letter-spacing="0">Without it: rollbacks and lost items on every world switch.</text>
<g>
  <rect x="56" y="140" width="344" height="174" rx="14" fill="#F8F8F8" stroke="#2B2D42" stroke-width="4"/>
  <rect x="64" y="148" width="328" height="158" rx="9" fill="none" stroke="#8A8FA8" stroke-width="2"/>
  <text x="84" y="184" class="mono" font-size="18" font-weight="800" fill="#E3350D" text-anchor="start" letter-spacing="2">01  SAVE</text>
  <text x="84" y="220" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">Source world saves the</text>
<text x="84" y="246" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">player, then marks them</text>
<text x="84" y="272" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">READY in Redis.</text>
  
</g>
<g>
  <rect x="428" y="140" width="344" height="174" rx="14" fill="#F8F8F8" stroke="#2B2D42" stroke-width="4"/>
  <rect x="436" y="148" width="328" height="158" rx="9" fill="none" stroke="#8A8FA8" stroke-width="2"/>
  <text x="456" y="184" class="mono" font-size="18" font-weight="800" fill="#E3350D" text-anchor="start" letter-spacing="2">02  WAIT</text>
  <text x="456" y="220" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">Target world waits for</text>
<text x="456" y="246" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">READY before it loads</text>
<text x="456" y="272" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">anything.</text>
  
</g>
<g>
  <rect x="800" y="140" width="344" height="174" rx="14" fill="#F8F8F8" stroke="#2B2D42" stroke-width="4"/>
  <rect x="808" y="148" width="328" height="158" rx="9" fill="none" stroke="#8A8FA8" stroke-width="2"/>
  <text x="828" y="184" class="mono" font-size="18" font-weight="800" fill="#E3350D" text-anchor="start" letter-spacing="2">03  GUARD</text>
  <text x="828" y="220" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">Every write carries a</text>
<text x="828" y="246" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">version. A stale save</text>
<text x="828" y="272" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">never overwrites newer</text>
<text x="828" y="298" class="mono" font-size="17" font-weight="400" fill="#1E2030" text-anchor="start" letter-spacing="0">data.</text>
  <rect class="blink" x="1110" y="282" width="12" height="12" fill="#E3350D"/>
</g>
<path class="flow" d="M402 227 H426" stroke="#FFCB05" stroke-width="4"/>
<path class="flow" d="M774 227 H798" stroke="#FFCB05" stroke-width="4"/>
<rect x="56" y="344" width="1088" height="48" rx="10" fill="#3DDC84" fill-opacity=".1" stroke="#3DDC84" stroke-opacity=".6" stroke-width="2"/>
<text x="80" y="374" class="mono" font-size="17" font-weight="800" fill="#3DDC84" text-anchor="start" letter-spacing="2">RESULT</text>
<text x="170" y="374" class="mono" font-size="17" font-weight="400" fill="#F3F4F7" text-anchor="start" letter-spacing="0">no rollbacks · no lost items · one chat relayed across all five worlds</text>

</svg>
